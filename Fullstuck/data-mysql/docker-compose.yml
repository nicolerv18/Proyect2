services:
  sqlserver-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recordStore-Sql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AdminRecord*"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: